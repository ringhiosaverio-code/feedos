/* ============================================================
   FeedOS 16 · sistema grafico
   Palette: verde silo (azione), oro mais (evidenza), neutri con lieve tinta verde.
   Caratteri: FeedOS Display (grottesco condensato, titoli), FeedOS Sans (testo e dati), FeedOS Mono (codici).
   ============================================================ */
:root {
  color-scheme: light;
  --bg: #EDF1EC; --surface: #FBFCFA; --surface-2: #F3F6F2; --surface-3: #E5ECE6; --overlay: rgba(16, 26, 20, .38);
  --ink: #101A14; --ink-2: #405048; --muted: #6A786F; --line: #D5DDD5; --line-2: #BFCAC1;
  --accent: #1D6B45; --accent-2: #155235; --accent-soft: #DCEBE1; --accent-ink: #FFFFFF;
  --maize: #D5940F; --maize-soft: #FAEFD2; --maize-ink: #6B4700;
  --good: #0CA30C; --good-ink: #0B6B20; --good-soft: #DDF2DC;
  --warn: #FAB219; --warn-ink: #7E5300; --warn-soft: #FCF1D4;
  --serious: #EC835A; --serious-ink: #A0431D; --serious-soft: #FBE5DB;
  --crit: #D03B3B; --crit-ink: #B02727; --crit-soft: #F8DEDC;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --seq-1: #cde2fb; --seq-3: #86b6ef; --seq-5: #3987e5; --seq-7: #1c5cab; --seq-9: #0d366b;
  --grid: #E1E7E1; --axis: #BFCAC1;
  --shadow: 0 1px 2px rgba(16, 26, 20, .06), 0 8px 24px rgba(16, 26, 20, .07);
  --shadow-lg: 0 24px 64px rgba(16, 26, 20, .22);
  --r: 10px; --r-sm: 7px;
  --f-display: 'FeedOS Display', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --f-sans: 'FeedOS Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --f-mono: 'FeedOS Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace;
  --side: 244px; --top: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0B110E; --surface: #121A16; --surface-2: #18221D; --surface-3: #223029; --overlay: rgba(0, 0, 0, .55);
    --ink: #E7EEE9; --ink-2: #AFBDB4; --muted: #7D8C83; --line: #25312B; --line-2: #34423B;
    --accent: #4FC18B; --accent-2: #6CD3A1; --accent-soft: #163327; --accent-ink: #04120A;
    --maize: #F0B93A; --maize-soft: #3A2E10; --maize-ink: #F6D17C;
    --good-ink: #4CCB4C; --good-soft: #13301A; --warn-ink: #F6C454; --warn-soft: #3A2F10; --serious-ink: #F29B78; --serious-soft: #3B2219; --crit-ink: #F07B7B; --crit-soft: #3C1A1A;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --seq-1: #0d366b; --seq-3: #1c5cab; --seq-5: #3987e5; --seq-7: #86b6ef; --seq-9: #cde2fb;
    --grid: #1E2923; --axis: #34423B;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35); --shadow-lg: 0 24px 64px rgba(0, 0, 0, .6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B110E; --surface: #121A16; --surface-2: #18221D; --surface-3: #223029; --overlay: rgba(0, 0, 0, .55);
  --ink: #E7EEE9; --ink-2: #AFBDB4; --muted: #7D8C83; --line: #25312B; --line-2: #34423B;
  --accent: #4FC18B; --accent-2: #6CD3A1; --accent-soft: #163327; --accent-ink: #04120A;
  --maize: #F0B93A; --maize-soft: #3A2E10; --maize-ink: #F6D17C;
  --good-ink: #4CCB4C; --good-soft: #13301A; --warn-ink: #F6C454; --warn-soft: #3A2F10; --serious-ink: #F29B78; --serious-soft: #3B2219; --crit-ink: #F07B7B; --crit-soft: #3C1A1A;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --seq-1: #0d366b; --seq-3: #1c5cab; --seq-5: #3987e5; --seq-7: #86b6ef; --seq-9: #cde2fb;
  --grid: #1E2923; --axis: #34423B;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35); --shadow-lg: 0 24px 64px rgba(0, 0, 0, .6);
}
/* modalità aula: caratteri più grandi per proiettore */
:root[data-size="aula"] { font-size: 17px; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
:root[data-size="aula"] body { font-size: 16px; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--maize-soft); }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; text-wrap: balance; }
p { margin: 0; }
.num, .tab { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: .92em; letter-spacing: -.01em; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.small { font-size: 12.5px; }
.xs { font-size: 11.5px; }
.nowrap { white-space: nowrap; }
.right { text-align: right; }
.center { text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.eyebrow { font: 700 11px/1.2 var(--f-sans); letter-spacing: .11em; text-transform: uppercase; color: var(--muted); }
.hr { height: 1px; background: var(--line); border: 0; margin: 0; }
[hidden] { display: none !important; }

/* ---------- guscio ---------- */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 14px; padding: 16px 12px 12px; border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 6px; border: 0; background: none; cursor: pointer; text-align: left; }
.brand .mark { width: 34px; height: 34px; border-radius: 9px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font: 700 17px/1 var(--f-display); letter-spacing: .02em; position: relative; overflow: hidden; }
.brand .mark::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--maize); }
.brand b { display: block; font: 700 21px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; }
.brand small { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
.dataset { margin: 0 4px; padding: 9px 10px; border-radius: var(--r-sm); border: 1px dashed var(--line-2); display: grid; gap: 2px; font-size: 12px; }
.dataset.demo { border-color: var(--maize); background: var(--maize-soft); color: var(--maize-ink); }
.dataset b { font-size: 12.5px; }
.nav { display: grid; gap: 2px; }
.nav .grp { margin: 10px 10px 4px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 8px; color: var(--ink-2); font-weight: 500; text-decoration: none; position: relative; }
.nav a svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 700; }
.nav a[aria-current="page"] svg { color: var(--accent); opacity: 1; }
.nav .count { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--crit-soft); color: var(--crit-ink); }
.nav .count.soft { background: var(--surface-3); color: var(--ink-2); }
.side-foot { margin-top: auto; display: grid; gap: 8px; padding: 10px 8px 2px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.savestate { display: flex; align-items: center; gap: 7px; }
.savestate i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.savestate.pending i { background: var(--warn); }
.savestate.error i { background: var(--crit); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 30; height: var(--top); display: flex; align-items: center; gap: 10px; padding: 0 20px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.2) blur(10px); border-bottom: 1px solid var(--line); }
.crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--muted); font-size: 13px; }
.crumbs b { color: var(--ink); font-weight: 700; }
.cmd { margin-left: auto; display: flex; align-items: center; gap: 10px; width: min(420px, 38vw); height: 36px; padding: 0 10px 0 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; text-align: left; }
.cmd:hover { border-color: var(--line-2); color: var(--ink-2); }
.cmd svg { width: 16px; height: 16px; flex: none; }
.cmd span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
kbd { font: 600 11px/1 var(--f-sans); padding: 3px 5px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; color: var(--ink-2); background: var(--surface-2); }
.tb { display: flex; align-items: center; gap: 6px; }
.content { width: 100%; max-width: 1480px; margin: 0 auto; padding: 22px 24px 64px; display: grid; gap: 18px; }
.mnav { display: none; }

/* ---------- intestazione di pagina ---------- */
.ph { display: grid; gap: 12px; }
.ph-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.ph h1 { font: 700 38px/0.95 var(--f-display); letter-spacing: .005em; text-transform: uppercase; }
.ph .lead { color: var(--ink-2); max-width: 72ch; margin-top: 8px; font-size: 14.5px; }
.ph-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a, .tabs button { flex: none; padding: 9px 14px 10px; border: 0; background: none; border-bottom: 2px solid transparent; color: var(--ink-2); font-weight: 600; cursor: pointer; text-decoration: none; margin-bottom: -1px; }
.tabs a:hover, .tabs button:hover { color: var(--ink); }
.tabs [aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .n { margin-left: 6px; font-size: 11px; padding: 1px 6px; border-radius: 9px; background: var(--surface-3); color: var(--ink-2); }

/* ---------- blocchi ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.panel > .hd { display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: 14px 16px 10px; flex-wrap: wrap; }
.panel > .hd h2, .panel > .hd h3 { font-size: 15px; font-weight: 700; }
.panel > .hd .sub { color: var(--muted); font-size: 12.5px; }
.panel > .bd { padding: 0 16px 16px; }
.panel > .bd.flush { padding: 0; }
.panel.inset { background: var(--surface-2); }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.split.r { grid-template-columns: minmax(0, 1fr) minmax(0, 1.65fr); }
.stack { display: grid; gap: 16px; align-content: start; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.row.start { align-items: flex-start; }
.gap-s { gap: 6px; } .gap-l { gap: 18px; }
.sp { flex: 1; }

/* ---------- indicatori ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { position: relative; display: grid; gap: 4px; padding: 14px 14px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; text-align: left; }
button.kpi { cursor: pointer; }
button.kpi:hover { border-color: var(--line-2); }
.kpi .lbl { font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
.kpi .val { font-size: 26px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap; }
.kpi .val small { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.kpi .foot { display: flex; align-items: center; gap: 8px; justify-content: space-between; font-size: 12px; color: var(--muted); min-height: 22px; }
.kpi .spark { width: 84px; height: 22px; flex: none; }
.delta { font-weight: 700; font-size: 12px; }
.delta.up.good, .delta.down.good { color: var(--good-ink); }
.delta.up.bad, .delta.down.bad { color: var(--crit-ink); }
.hero-fig { font-size: 52px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }

/* ---------- pulsanti e controlli ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13.5px; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.danger { color: var(--crit-ink); }
.btn.small { height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 7px; }
.btn.icon { width: 34px; padding: 0; }
.btn.icon.small { width: 28px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.maize { background: var(--maize); border-color: var(--maize); color: #1B1300; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 7px; color: var(--ink-2); font-weight: 600; font-size: 12.5px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.field > small { font-size: 11.5px; color: var(--muted); }
.input, .select, textarea.input { width: 100%; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); }
textarea.input { height: auto; min-height: 72px; padding: 8px 10px; resize: vertical; }
.input:focus, .select:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 0; border-color: var(--accent); }
.input.num { text-align: right; font-variant-numeric: tabular-nums; }
.input.slim { height: 28px; padding: 0 8px; border-radius: 6px; }
.input.warn { border-color: var(--serious); }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; }
.range { width: 100%; accent-color: var(--accent); }
.search { position: relative; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); }
.search .input { padding-left: 32px; }
.filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------- chip di stato (icona + testo, mai solo colore) ---------- */
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 11.5px; font-weight: 700; white-space: nowrap; background: var(--surface-3); color: var(--ink-2); }
.chip svg { width: 13px; height: 13px; flex: none; }
.chip.good { background: var(--good-soft); color: var(--good-ink); }
.chip.warn { background: var(--warn-soft); color: var(--warn-ink); }
.chip.serious { background: var(--serious-soft); color: var(--serious-ink); }
.chip.crit { background: var(--crit-soft); color: var(--crit-ink); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip.maize { background: var(--maize-soft); color: var(--maize-ink); }
.chip.outline { background: transparent; border: 1px solid var(--line-2); }
.cls { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font-weight: 800; font-size: 12px; }
.cls.A { background: var(--good-soft); color: var(--good-ink); }
.cls.B { background: var(--warn-soft); color: var(--warn-ink); }
.cls.C { background: var(--crit-soft); color: var(--crit-ink); }
.code { font-family: var(--f-mono); font-size: 12px; padding: 1px 6px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
button.code { cursor: pointer; }
button.code:hover { border-color: var(--accent); color: var(--accent); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }
.key { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; }

/* ---------- tabelle ---------- */
.tw { overflow: auto; max-width: 100%; }
.tw.tall { max-height: 560px; }
table.t { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
table.t th { position: sticky; top: 0; z-index: 1; background: var(--surface-2); color: var(--ink-2); font-weight: 700; font-size: 11.5px; letter-spacing: .03em; text-transform: uppercase; text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t th.r, table.t td.r { text-align: right; }
table.t th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
table.t td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; font-variant-numeric: tabular-nums; }
table.t tr:last-child td { border-bottom: 0; }
table.t tbody tr:hover td { background: var(--surface-2); }
table.t tr.click { cursor: pointer; }
table.t tr.sel td { background: var(--accent-soft); }
table.t td .sub { display: block; font-size: 11.5px; color: var(--muted); }
table.t tfoot td { font-weight: 700; background: var(--surface-2); border-top: 1px solid var(--line); }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.bar-cell { position: relative; height: 8px; border-radius: 4px; background: var(--surface-3); min-width: 60px; }
.bar-cell i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--s1); }

/* ---------- elenco segnali ---------- */
.signals { display: grid; }
.sig { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 4px 12px; padding: 13px 16px; border-top: 1px solid var(--line); align-items: start; }
.sig:first-child { border-top: 0; }
.sig .ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; }
.sig .ic svg { width: 16px; height: 16px; }
.sig.critico .ic { background: var(--crit-soft); color: var(--crit-ink); }
.sig.attenzione .ic { background: var(--warn-soft); color: var(--warn-ink); }
.sig.info .ic { background: var(--surface-3); color: var(--ink-2); }
.sig h4 { font-size: 14px; font-weight: 700; }
.sig .why { color: var(--ink-2); font-size: 13px; margin-top: 3px; max-width: 80ch; }
.sig .act { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.sig .meta { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.sig .btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

/* ---------- pannello laterale, finestre, avvisi ---------- */
.scrim { position: fixed; inset: 0; background: var(--overlay); z-index: 60; animation: fade .18s ease; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); z-index: 61; background: var(--surface); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; animation: slide .22s cubic-bezier(.2, .8, .2, 1); }
.drawer.wide { width: min(920px, 100%); }
.drawer > .hd { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
.drawer > .hd h2 { font-size: 20px; }
.drawer > .bd { flex: 1; overflow: auto; padding: 18px 20px 28px; display: grid; gap: 16px; align-content: start; }
.drawer > .ft { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.modal { position: fixed; z-index: 70; left: 50%; top: 12vh; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); max-height: 76vh; overflow: auto; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg); animation: pop .18s ease; }
.modal .hd { padding: 18px 20px 6px; } .modal .bd { padding: 8px 20px 12px; display: grid; gap: 12px; } .modal .ft { padding: 12px 20px 18px; display: flex; gap: 8px; justify-content: flex-end; }
.toasts { position: fixed; z-index: 90; left: 50%; bottom: 22px; transform: translateX(-50%); display: grid; gap: 8px; width: min(520px, calc(100% - 32px)); }
.toast { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 10px; background: var(--ink); color: var(--bg); box-shadow: var(--shadow-lg); font-weight: 600; animation: pop .2s ease; }
.toast svg { width: 17px; height: 17px; flex: none; }
.toast button { margin-left: auto; background: none; border: 1px solid color-mix(in srgb, var(--bg) 40%, transparent); color: var(--bg); border-radius: 7px; padding: 4px 9px; font-weight: 700; cursor: pointer; }
@keyframes fade { from { opacity: 0; } }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
@keyframes pop { from { transform: translate(-50%, 8px) scale(.98); opacity: 0; } }
.toast { animation-name: fadeup; }
@keyframes fadeup { from { transform: translateY(8px); opacity: 0; } }

/* ---------- palette dei comandi ---------- */
.pal { position: fixed; z-index: 80; left: 50%; top: 11vh; transform: translateX(-50%); width: min(680px, calc(100% - 24px)); background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg); overflow: hidden; animation: pop .16s ease; border: 1px solid var(--line); }
.pal .q { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.pal .q svg { width: 18px; height: 18px; color: var(--muted); }
.pal .q input { flex: 1; border: 0; outline: 0; background: none; font-size: 16px; }
.pal ul { list-style: none; margin: 0; padding: 6px; max-height: 58vh; overflow: auto; }
.pal li { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
.pal li svg { width: 17px; height: 17px; color: var(--muted); flex: none; }
.pal li .g { margin-left: auto; font-size: 11.5px; color: var(--muted); }
.pal li[aria-selected="true"] { background: var(--accent-soft); }
.pal li small { color: var(--muted); }
.pal .hint { padding: 9px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }

/* ---------- grafici ---------- */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--f-sans); fill: var(--muted); font-size: 11px; }
.chart .lbl-ink { fill: var(--ink-2); font-weight: 600; }
.chart .lbl-strong { fill: var(--ink); font-weight: 700; }
.chart .grid line { stroke: var(--grid); stroke-width: 1; }
.chart .axis line { stroke: var(--axis); }
.chart .hit { fill: transparent; }
.tip { position: absolute; z-index: 5; pointer-events: none; min-width: 120px; max-width: 280px; padding: 8px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--shadow); font-size: 12px; transform: translate(-50%, calc(-100% - 10px)); }
.tip b { display: block; font-size: 13.5px; }
.tip .r { display: flex; align-items: center; gap: 7px; justify-content: space-between; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend i.line { height: 3px; width: 14px; border-radius: 2px; }

/* ---------- componenti di dominio ---------- */
.silo { display: grid; justify-items: center; gap: 6px; width: 74px; }
.silo .tank { position: relative; width: 38px; height: 84px; border-radius: 12px 12px 6px 6px; border: 2px solid var(--line-2); background: var(--surface-2); overflow: hidden; }
.silo .tank::after { content: ''; position: absolute; left: 50%; bottom: -1px; width: 12px; height: 6px; transform: translateX(-50%); background: var(--line-2); border-radius: 2px 2px 0 0; }
.silo .fill { position: absolute; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--maize) 70%, var(--surface)); transition: height .5s ease; }
.silo.low .fill { background: color-mix(in srgb, var(--serious) 75%, var(--surface)); }
.silo.out .fill { background: var(--crit); }
.silo .safety { position: absolute; left: -2px; right: -2px; border-top: 2px dashed var(--ink-2); opacity: .55; }
.silo b { font-size: 12px; text-align: center; line-height: 1.2; }
.silo small { font-size: 11px; color: var(--muted); text-align: center; }
.label-card { background: #FFFEF8; color: #151515; border: 1px solid #CFCAB8; border-top: 7px solid #151515; border-radius: 4px; padding: 16px 18px; font-size: 12.5px; line-height: 1.45; box-shadow: var(--shadow); font-family: var(--f-sans); }
.label-card h3 { font: 700 20px/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .01em; }
.label-card .k { font: 700 10.5px/1.2 var(--f-sans); letter-spacing: .09em; text-transform: uppercase; margin: 10px 0 3px; color: #545045; }
.label-card .m { font-family: var(--f-mono); font-size: 11.5px; }
.label-card .note { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #CFCAB8; color: #6B6552; font-size: 11px; }
.bullet { position: relative; height: 18px; }
.bullet .track { position: absolute; left: 0; right: 0; top: 7px; height: 4px; border-radius: 2px; background: var(--surface-3); }
.bullet .ok { position: absolute; top: 5px; height: 8px; border-radius: 3px; background: color-mix(in srgb, var(--good) 28%, transparent); }
.bullet .mark { position: absolute; top: 1px; width: 3px; height: 16px; margin-left: -1.5px; border-radius: 2px; background: var(--ink); }
.bullet .mark.bad { background: var(--crit); }
.steps { display: flex; gap: 0; }
.kanban { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; }
.kanban .col { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 200px; }
.kanban .col h4 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); display: flex; justify-content: space-between; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; display: grid; gap: 6px; cursor: pointer; text-align: left; }
.card:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.empty { display: grid; justify-items: center; gap: 8px; padding: 30px 16px; text-align: center; color: var(--muted); }
.empty svg { width: 28px; height: 28px; opacity: .6; }
.note { padding: 10px 12px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); }
.note.maize { background: var(--maize-soft); border-color: color-mix(in srgb, var(--maize) 45%, transparent); color: var(--maize-ink); }
.note.crit { background: var(--crit-soft); border-color: color-mix(in srgb, var(--crit) 35%, transparent); color: var(--crit-ink); }
.note.good { background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 35%, transparent); color: var(--good-ink); }
.kv { display: grid; grid-template-columns: minmax(120px, max-content) minmax(0, 1fr); gap: 7px 16px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 600; min-width: 0; }
.steplist { counter-reset: s; display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.steplist li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; gap: 10px; }
.steplist li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 800; font-size: 12px; }

/* ---------- gemello digitale ---------- */
.twin { position: relative; background: radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--surface) 92%, var(--maize) 8%), var(--surface) 60%); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.twin svg text { font-family: var(--f-sans); }
.twin .node { cursor: pointer; }
.twin .node:hover .shape, .twin .node:focus .shape { stroke: var(--accent); stroke-width: 2.5; }
.twin .flow { fill: none; stroke-linecap: round; }
.twin .particle { fill: var(--maize); }
@media (prefers-reduced-motion: reduce) { .twin .particle { display: none; } * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ---------- tour guidato ---------- */
.tour-spot { position: fixed; z-index: 85; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(8, 12, 10, .62); outline: 2px solid var(--maize); transition: all .35s cubic-bezier(.2, .8, .2, 1); pointer-events: none; }
.tour-card { position: fixed; z-index: 86; width: min(400px, calc(100% - 32px)); background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 18px 18px 14px; display: grid; gap: 10px; border-top: 5px solid var(--maize); }
.tour-card h3 { font: 700 22px/1 var(--f-display); text-transform: uppercase; }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .g5 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split, .split.r { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 980px) {
  :root { --side: 72px; }
  .side { padding: 14px 8px; }
  .brand b, .brand small, .dataset, .nav .grp, .nav a span, .side-foot .txt { display: none; }
  .nav a { justify-content: center; padding: 10px; }
  .nav .count { position: absolute; top: 2px; right: 2px; min-width: 16px; height: 16px; font-size: 10px; padding: 0 4px; }
  .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 720px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .top { padding: 0 12px; }
  .crumbs .area-only { display: none; }
  .cmd { width: auto; flex: 1; }
  .cmd kbd, .tb .hide-m { display: none; }
  .content { padding: 14px 16px 96px; gap: 14px; }
  .ph h1 { font-size: 30px; }
  .g2, .g3, .g4, .g5 { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi .val { font-size: 22px; }
  .mnav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); justify-content: space-around; }
  .mnav a, .mnav button { display: grid; justify-items: center; gap: 2px; padding: 4px 6px; border: 0; background: none; color: var(--ink-2); font-size: 10.5px; font-weight: 600; text-decoration: none; min-width: 58px; cursor: pointer; position: relative; }
  .mnav svg { width: 21px; height: 21px; }
  .mnav [aria-current="page"] { color: var(--accent); }
  .mnav .count { position: absolute; top: 0; right: 10px; min-width: 16px; height: 16px; border-radius: 8px; font-size: 10px; display: grid; place-items: center; background: var(--crit); color: #fff; padding: 0 4px; }
  .sig { grid-template-columns: 28px minmax(0, 1fr); }
  .sig .btns { grid-column: 2; justify-content: flex-start; }
  .drawer > .hd, .drawer > .bd { padding-left: 16px; padding-right: 16px; }
  .kv { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .kv dd { margin-bottom: 6px; }
}
@media print {
  .side, .top, .mnav, .ph-actions, .tabs, .btn, .toasts { display: none !important; }
  .app { display: block; }
  body { background: #fff; color: #000; }
  .panel { break-inside: avoid; border-color: #bbb; }
  .content { padding: 0; max-width: none; }
}

/* ---------- elenco di scelta (specifiche, clienti, ecc.) ---------- */
.picklist { display: grid; }
.picklist button { display: grid; gap: 2px; text-align: left; padding: 11px 16px; border: 0; border-top: 1px solid var(--line); background: none; cursor: pointer; }
.picklist button:first-child { border-top: 0; }
.picklist button:hover { background: var(--surface-2); }
.picklist button[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.picklist button span { font-size: 12px; color: var(--muted); }

.grid.start { align-items: start; }
.select.grow, .input.grow { flex: 1; width: auto; min-width: 0; }

/* ---------- acquisti ---------- */
.silos { display: flex; flex-wrap: wrap; gap: 14px 8px; }
button.silo { border: 0; background: none; cursor: pointer; padding: 8px 4px 6px; border-radius: 10px; font: inherit; color: inherit; width: 96px; }
button.silo:hover { background: var(--surface-2); }
button.silo b { font-size: 12px; }
table.t.heat td.hc { text-align: center; font-weight: 600; font-size: 12px; position: relative; min-width: 70px; white-space: nowrap; border-left: 2px solid var(--surface); }
table.t.heat td.hc.ok { background: color-mix(in srgb, var(--good) 9%, var(--surface)); color: var(--good-ink); }
table.t.heat td.hc.sotto { background: var(--warn-soft); color: var(--warn-ink); }
table.t.heat td.hc.rottura { background: var(--crit-soft); color: var(--crit-ink); }
table.t.heat td.hc .in { position: absolute; top: 2px; right: 4px; color: var(--ink-2); }
table.t.heat td.hc .in svg { width: 11px; height: 11px; }
table.t.heat td.hc .in { font-style: normal; font-size: 9px; color: var(--ink-2); }
table.t.heat td.hc .in.plan { color: var(--s1); }

/* ---------- produzione ---------- */
table.t.load td.lc { position: relative; text-align: right; cursor: pointer; min-width: 86px; padding-bottom: 14px; border-left: 2px solid var(--surface); }
table.t.load td.lc b { display: block; font-size: 13.5px; }
table.t.load td.lc span { font-size: 11.5px; color: var(--muted); }
table.t.load td.lc i { position: absolute; left: 10px; bottom: 6px; height: 4px; border-radius: 2px; background: var(--s1); }
table.t.load td.lc.hi i { background: var(--serious); }
table.t.load td.lc.over { background: var(--crit-soft); }
table.t.load td.lc.over b { color: var(--crit-ink); }
table.t.load td.lc.over i { background: var(--crit); }
table.t.load td.lc.on { box-shadow: inset 0 0 0 2px var(--accent); }
.kpi.linecard { cursor: pointer; }
.kpi.linecard.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
button.chip { cursor: pointer; font: inherit; font-size: 11.5px; font-weight: 700; }
.chip.pick { height: 26px; padding: 0 10px; }
.chip.pick:hover { border-color: var(--accent); }
.chip.pick.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.kanban .col h4 span { font-weight: 700; color: var(--muted); }
.kanban .card b { font-size: 13px; line-height: 1.3; }
.panel > .hd .select { width: auto; max-width: 280px; }
/* ---------- commerciale ---------- */
.offer-check { border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; background: var(--surface-2); align-content: start; }
.offer-check.sotto-minimo { background: var(--crit-soft); border-color: color-mix(in srgb, var(--crit) 35%, transparent); }
.offer-check.sotto-obiettivo { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.offer-check.ok { background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 35%, transparent); }
.offer-check .big .chip { height: 28px; font-size: 13px; padding: 0 12px; }
.chart.map .prov { font: 700 11px var(--f-sans); fill: var(--muted); letter-spacing: .08em; }
/* ---------- economia ---------- */
.linkish { all: unset; cursor: pointer; display: inline-flex; align-items: center; }
.linkish:hover { text-decoration: underline; }
.linkish:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.chip .linkish svg { width: 12px; height: 12px; margin-left: 4px; }
.slider { display: grid; gap: 2px; }
.range:disabled { opacity: .4; }
.kpis.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
/* ---------- ESG ---------- */
.passport { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; display: grid; gap: 18px; border-top: 6px solid var(--accent); }
.pp-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.pp-head h2 { font: 700 30px/1 var(--f-display); text-transform: uppercase; margin: 4px 0; }
.pp-code { display: grid; gap: 2px; text-align: right; padding: 8px 12px; border: 1px dashed var(--line-2); border-radius: 9px; }
.pp-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 28px; }
.pp-grid > div { display: grid; gap: 8px; align-content: start; }
.pp-big b { font-size: 48px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
.pp-big > span:not(.eyebrow) { color: var(--ink-2); }
.pp-note { font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
pre.report { white-space: pre-wrap; font: 12.5px/1.55 var(--f-mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; max-height: 620px; overflow: auto; margin: 0; }
.select.auto { width: auto; max-width: 320px; }
@media (max-width: 720px) { .pp-grid { grid-template-columns: minmax(0, 1fr); } .pp-code { text-align: left; } }
@media print { .no-print { display: none !important; } .passport { border: 0; padding: 0; } }
.panel.hilite { box-shadow: 0 0 0 2px var(--maize); }
label.btn { position: relative; }

/* ---------- schede laterali ---------- */
.dicon { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.dicon svg { width: 20px; height: 20px; }
.dsec { display: grid; gap: 6px; }
.dsec > .eyebrow { margin-bottom: 2px; }
.dlink { display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; text-align: left; font: inherit; color: inherit; }
.dlink:hover { border-color: var(--accent); background: var(--surface-2); }
.dlink > span:first-child { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dlink .muted { font-size: 12px; margin-left: auto; white-space: nowrap; }
.nutgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.nutgrid div { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; display: grid; background: var(--surface-2); }
.nutgrid span { font-size: 11px; color: var(--muted); font-weight: 700; }
.nutgrid b { font-size: 15px; }
.nutgrid small { font-size: 10.5px; color: var(--muted); }

.tour-dots { display: flex; gap: 5px; }
.tour-dots i { width: 18px; height: 4px; border-radius: 2px; background: var(--surface-3); }
.tour-dots i.done { background: color-mix(in srgb, var(--maize) 55%, var(--surface-3)); }
.tour-dots i.on { background: var(--maize); }
.cmd { min-width: 0; }
.tb { flex: none; }
@media (max-width: 720px) { .top { gap: 6px; } .tb .btn.icon { width: 32px; } }
.seg { flex-wrap: wrap; max-width: 100%; }
.show-m { display: none; }
@media (max-width: 720px) { .hide-m { display: none !important; } .show-m { display: inline; } }
.twin svg text { fill: var(--muted); }
.twin svg .lbl-ink { fill: var(--ink-2); font-weight: 600; }
.twin svg .lbl-strong { fill: var(--ink); font-weight: 700; }
